name: AnchoredFreecam
version: '${version}'
main: io.github.sanowo0390.anchoredfreecam.AnchoredFreecamPlugin
api-version: '26.2'
author: Sanowo0390
description: Server-side anchored freecam for survival servers, with a damageable body proxy.
website: https://github.com/Sanowo0390/Anchored-Freecam
commands:
  freecam:
    description: AnchoredFreecam commands.
    usage: /freecam [on|off|toggle|status|range|language|reload]
    aliases: [fc]
permissions:
  anchoredfreecam.use:
    description: Allows using AnchoredFreecam.
    default: false
  anchoredfreecam.range:
    description: Allows viewing/changing the global freecam range.
    default: op
  anchoredfreecam.language:
    description: Allows viewing/changing the plugin language.
    default: op
  anchoredfreecam.reload:
    description: Allows reloading AnchoredFreecam's configuration.
    default: op
  anchoredfreecam.admin:
    description: Grants all AnchoredFreecam permissions.
    default: op
    children:
      anchoredfreecam.use: true
      anchoredfreecam.range: true
      anchoredfreecam.language: true
      anchoredfreecam.reload: true
