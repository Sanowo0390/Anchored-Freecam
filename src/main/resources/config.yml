# Language used for player-facing messages.
# The value maps to plugins/AnchoredFreecam/lang/<language>.yml.
# Any file name using letters, numbers, "_" or "-" can be used, e.g. ru, uk, de, pt_br.
language: ja

# If the selected language is missing a message key, read that key from this language.
fallback-language: ja

# Maximum 3D distance from the anchor, in blocks ("マス").
# Default: 15
# Crossing the boundary does NOT end freecam; the camera is returned to
# its last valid in-range position.
max-distance-blocks: 15.0

# Leave a visible/damageable body proxy at the anchor.
# Paper 26.2 Mannequin is used and receives the player's skin/equipment.
leave-body-at-anchor: true

# Show the real player's name above the anchored Mannequin body.
show-body-nameplate: true

# If the body proxy is damaged, immediately end freecam, return the real player
# to the anchor, then forward that damage to the real player.
exit-on-body-damage: true

# Hide the real moving Player (the camera).
# Human players are hidden with hidePlayer(), and the camera Player also receives
# the invisible entity flag so its model is not visible.
hide-camera-player-from-others: true

# Continuously keep normal hostile Monster targets on the anchored Mannequin.
# This is needed because vanilla mob target selectors normally target Player,
# not Mannequin.
force-hostile-mob-aggro: true

# Cubic scan radius around each anchored body for hostile mobs.
mob-aggro-radius-blocks: 32.0

# Prevent environmental/other damage from affecting the moving camera entity.
# Damage received by the body proxy is handled separately above.
protect-camera-player: true

# Disable entity-to-entity collision for the moving camera.
# Block collision remains enabled.
disable-camera-entity-collision: true

# Warn in the action bar when the camera is returned inside the radius.
show-boundary-message: true


# Generic TPA / teleport-plugin compatibility.
# If another player is teleported to the moving freecam camera position,
# rewrite that destination to the anchored body instead.
redirect-teleports-to-body: true

# How close an external teleport destination must be to the camera position
# before it is treated as a teleport "to that player".
teleport-camera-match-radius-blocks: 0.75
